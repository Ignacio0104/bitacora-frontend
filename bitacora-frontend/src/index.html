<!doctype html>
<html lang="en">
  <head>
    <title>Bitacora Vital</title>
    <meta name="theme-color" content="#faf6f0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .splash {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f9f4ee;
      }
      .splash img {
        width: 160px;
        height: auto;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% {
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="splash"><img src="/assets/images/logo.jpg" alt="Bitacora Vital" /></div>
    </app-root>
  </body>
</html>
