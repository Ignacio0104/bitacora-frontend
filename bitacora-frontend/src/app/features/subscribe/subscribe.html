<main class="auth-wrap">
  <section class="auth-card">
    <app-logo />
    <h1>Sumate a las clases</h1>
    <p class="sub">
      Tu cuenta todavía no tiene acceso a los videos. Escribinos por WhatsApp y te activamos el
      acceso.
    </p>

    <a class="btn whatsapp" [href]="whatsappUrl()" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path
          d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.8-.1 1.5z"
        />
      </svg>
      Escribir por WhatsApp
    </a>

    <a class="btn insta" [href]="instagramUrl" target="_blank" rel="noopener noreferrer">
      Seguinos en {{ instagramHandle }}
    </a>

    <button class="link" type="button" (click)="logout()">Salir</button>
  </section>
</main>
