<header class="top">
  <a routerLink="/" aria-label="Volver a las clases">← Mis clases</a>
  <app-logo width="90px" />
</header>

<main class="content">
  @if (loading()) {
    <p class="state">Cargando...</p>
  } @else if (playback(); as p) {
    <app-video-player [youtubeId]="p.youtubeId" />
    <h1>{{ p.title }}</h1>
  } @else {
    <p class="state">No encontramos este video.</p>
  }
</main>
